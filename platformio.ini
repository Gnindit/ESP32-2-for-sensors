; ESP32-S3 fuel, RPM, voltage and current broadcaster over ESP-NOW.
[platformio]
default_envs = esp32-s3-2
extra_configs = platformio.local.ini

[env:esp32-s3-2]
platform = espressif32@7.0.1
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
build_flags =
  -D ARDUINO_USB_MODE=0
  -D ARDUINO_USB_CDC_ON_BOOT=0

; Build real sensor firmware without changing the default simulation build.
[env:esp32-s3-2-hardware]
extends = env:esp32-s3-2
build_flags =
  ${env:esp32-s3-2.build_flags}
  -D SENSOR_SIMULATION=false
